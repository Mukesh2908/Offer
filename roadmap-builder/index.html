<title>Waypoint Roadmaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a vertical spine of topic blocks with subtopics branching left and right on a pannable dotted canvas; toolbar on top. */
:root{
  --bg:#F2F4F8; --canvas:#F7F8FB; --dot:#D5DBE6; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#141A29; --muted:#5A6378; --line:#D8DEE8;
  --accent:#2B55E6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FD; --wire:#9AA6BD;
  --ok:#1E8A55; --ok-soft:#DDF3E7; --danger:#C0322B; --danger-soft:#FBE3E1;
  --core:#F5C518; --core-soft:#FFF6D1; --good:#2B55E6; --optional:#9AA3B5;
  --c1:#4F46E5; --c2:#0E8C7E; --c3:#D2461A; --c4:#B8327A; --c5:#7A4FD6; --c6:#2F7ABF;
  --shadow:0 1px 2px rgba(20,26,41,.07),0 3px 10px rgba(20,26,41,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D111A; --canvas:#10151F; --dot:#232C3D; --surface:#171D2A; --sunk:#1D2433; --ink:#E7EBF3; --muted:#98A1B6; --line:#2A3346;
  --accent:#7D9BFF; --accent-ink:#0D111A; --accent-soft:#1E2945; --wire:#4A5670;
  --ok:#4CC98A; --ok-soft:#15301F; --danger:#FF7A72; --danger-soft:#3A1917;
  --core:#F5C518; --core-soft:#3A3212; --good:#7D9BFF; --optional:#6C758A;
  --c1:#8B85FF; --c2:#3CC7B5; --c3:#FF875A; --c4:#F06BB0; --c5:#A98BFF; --c6:#62A8EA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D111A; --canvas:#10151F; --dot:#232C3D; --surface:#171D2A; --sunk:#1D2433; --ink:#E7EBF3; --muted:#98A1B6; --line:#2A3346;
  --accent:#7D9BFF; --accent-ink:#0D111A; --accent-soft:#1E2945; --wire:#4A5670;
  --ok:#4CC98A; --ok-soft:#15301F; --danger:#FF7A72; --danger-soft:#3A1917;
  --core:#F5C518; --core-soft:#3A3212; --good:#7D9BFF; --optional:#6C758A;
  --c1:#8B85FF; --c2:#3CC7B5; --c3:#FF875A; --c4:#F06BB0; --c5:#A98BFF; --c6:#62A8EA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:18px;margin-right:auto}
.pick{display:flex;align-items:center;gap:4px;min-width:0}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
select{max-width:210px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.sub h1{font-size:clamp(22px,3.2vw,30px);font-weight:700}
.sub .desc{color:var(--muted);font-size:14px;margin-top:2px;max-width:70ch}
.sub .grow{flex:1 1 320px;min-width:0}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .track{width:140px;height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .3s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;border:2px solid var(--line);background:var(--surface)}
.sw.core{border-color:var(--core);background:var(--core-soft)}
.sw.good{border-color:var(--good)}
.sw.optional{border-style:dashed;border-color:var(--optional)}
.sw.done{border-color:var(--ok);background:var(--ok-soft)}
.note{margin:10px 16px 0;padding:9px 12px;border-radius:8px;background:var(--sunk);font-size:13.5px;flex:none}

/* canvas */
.viewport{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;touch-action:none;cursor:grab}
.viewport.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:2}
.wire.spine{stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.wire.done{stroke:var(--ok)}
.node{position:absolute;transform:translate(-50%,-50%);border-radius:10px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:8px 12px;text-align:center;font-size:14px;font-weight:500;line-height:1.3;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;gap:6px}
.node:hover{filter:brightness(.98);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.node .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sec{background:var(--c);border-color:var(--c);color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px;padding:12px 16px}
.sec .n{font-family:var(--f-mono);font-weight:500;font-size:11.5px;opacity:.85;background:rgba(255,255,255,.18);border-radius:99px;padding:1px 7px}
.kid.core{border-color:var(--core);background:var(--core-soft)}
.kid.good{border-color:var(--good)}
.kid.optional{border-style:dashed;border-color:var(--optional);color:var(--muted)}
.kid.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.kid .ck{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--wire);display:inline-grid;place-items:center;font-size:10px;line-height:1}
.kid.done .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.kid .lk{flex:none;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.addnode{border-style:dashed;background:transparent;box-shadow:none;color:var(--muted);font-size:13px}
.title-node{background:var(--ink);color:var(--bg);border-color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:20px;padding:12px 20px;border-radius:12px}

.zoom{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:17px;font-weight:600}
.hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;z-index:2}

/* list view */
.list{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 60px}
.list .inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.lsec h2{font-size:19px;display:flex;align-items:center;gap:10px}
.lsec h2::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c)}
.lsec h2 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.lsec ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.lrow input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.lrow .tt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.lrow.done .tt{text-decoration:line-through;color:var(--muted)}
.tag{font-size:11.5px;font-family:var(--f-mono);border-radius:99px;padding:1px 8px;white-space:nowrap}
.tag.core{background:var(--core-soft);color:var(--ink);border:1px solid var(--core)}
.tag.optional{color:var(--muted);border:1px dashed var(--optional)}

.empty{flex:1;display:grid;place-items:center;padding:40px 16px;text-align:center}
.empty div{max-width:520px}
.empty h1{font-size:32px;margin-bottom:10px}
.empty p{color:var(--muted);margin:0 0 20px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* dialogs */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.panel{background:var(--surface);border-radius:14px;width:100%;max-width:540px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.panel h2{font-size:22px}
.panel .lead{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
textarea{resize:vertical;min-height:80px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px}
.actions .sp{flex:1}
.confirm{background:var(--danger-soft);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm span{flex:1 1 180px;font-size:14px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{color:var(--accent);overflow-wrap:anywhere;font-size:14px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{position:relative}
.colors input{position:absolute;opacity:0;inset:0}
.colors span{display:block;width:28px;height:28px;border-radius:8px;background:var(--c);border:3px solid transparent}
.colors input:checked+span{border-color:var(--ink)}
.colors input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.share-step{display:flex;flex-direction:column;gap:6px}
.share-step h3{font-family:var(--f-body);font-size:14px;font-weight:600}
.share-step p{margin:0;color:var(--muted);font-size:14px}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;font-family:var(--f-mono);font-size:13px}
.mono{font-family:var(--f-mono);font-size:12.5px;min-height:170px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:640px){.legend{display:none}.hint{display:none}.prog .track{width:90px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2v18" stroke="var(--wire)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/><path d="M11 7 C15 7 15 5 19 5 M11 15 C7 15 7 17 3 17" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><circle cx="11" cy="7" r="3" fill="var(--c3)"/><circle cx="11" cy="15" r="3" fill="var(--c1)"/></svg>
    Waypoint
  </div>
  <div class="pick" id="pick"></div>
  <div class="seg" role="group" aria-label="View">
    <button id="v-map" data-act="view" data-v="map">Map</button>
    <button id="v-list" data-act="view" data-v="list">Checklist</button>
  </div>
  <button class="btn" data-act="edit" id="editBtn" hidden>Edit</button>
  <button class="btn primary" data-act="share">Share</button>
</header>
<div id="subhead"></div>
<div id="notice"></div>
<div id="main" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script>
const COLORS=['c1','c2','c3','c4','c5','c6'];
const LEVELS={core:'Must know',good:'Good to know',optional:'Optional'};
const S={mode:'loading',maps:[],current:null,view:'map',editing:false,canWrite:true,uid:null,db:null,downloads:null,
  ready:false,done:{},modal:null,cam:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const safeUrl=u=>/^https?:\/\//i.test((u||'').trim())?u.trim():'';

/* ---------- outline import / export ---------- */
// Format: "# Title", then one line per topic, indented "- " lines for subtopics.
// Subtopic suffixes: "!" = must know, "?" = optional; "| https://…" adds a link.
function parseOutline(text){
  const lines=text.split(/\r?\n/);let name='',summary='';const sections=[];let cur=null;
  for(const raw of lines){
    if(!raw.trim())continue;
    const m=/^#\s+(.*)/.exec(raw.trim());
    if(m&&!name){name=m[1].trim();continue}
    if(/^>\s*/.test(raw.trim())&&!sections.length){summary=raw.trim().replace(/^>\s*/,'');continue}
    const indented=/^(\s+|[-*+]\s)/.test(raw)&&cur;
    let t=raw.trim().replace(/^[-*+]\s+/,'').replace(/^\[[ xX]\]\s*/,'').replace(/^#+\s*/,'').replace(/^\d+[.)]\s+/,'');
    if(!indented){cur={id:newId('s'),title:t,color:COLORS[sections.length%COLORS.length],children:[]};sections.push(cur);continue}
    let url='';const pi=t.indexOf('|');if(pi>=0){url=safeUrl(t.slice(pi+1));t=t.slice(0,pi).trim()}
    let level='good';if(/!\s*$/.test(t)){level='core';t=t.replace(/!\s*$/,'').trim()}else if(/\?\s*$/.test(t)){level='optional';t=t.replace(/\?\s*$/,'').trim()}
    cur.children.push({id:newId('k'),title:t,level,note:'',links:url?[{label:'',url}]:[]});
  }
  return{name:name||'Untitled roadmap',summary,sections};
}
function toOutline(m){
  const out=['# '+m.name];if(m.summary)out.push('> '+m.summary);
  m.sections.forEach(s=>{out.push('',s.title);s.children.forEach(k=>{
    const suf=k.level==='core'?' !':k.level==='optional'?' ?':'';const u=(k.links&&k.links[0]&&k.links[0].url)?' | '+k.links[0].url:'';
    out.push('  - '+k.title+suf+u)})});
  return out.join('\n');
}
function toMarkdown(m){
  const d=doneSet(m.id);const out=['# '+m.name];if(m.summary)out.push('',m.summary);
  m.sections.forEach((s,i)=>{out.push('',`## ${i+1}. ${s.title}`);s.children.forEach(k=>{
    const tag=k.level==='core'?' **(must know)**':k.level==='optional'?' _(optional)_':'';
    const links=(k.links||[]).filter(l=>safeUrl(l.url)).map(l=>`[${l.label||'link'}](${l.url})`).join(', ');
    out.push(`- [${d.has(k.id)?'x':' '}] ${k.title}${tag}${links?' — '+links:''}`)})});
  return out.join('\n');
}

const SAMPLE=`# Example: Learn Git
> Example roadmap. Edit it, or start your own from the menu.
Basics
  - What version control is !
  - Install and configure Git !
  - init, add, commit !
  - Reading git log
Branching
  - Create and switch branches !
  - Merging !
  - Resolving conflicts !
  - Rebasing ?
Remotes
  - Clone, push, pull !
  - Pull requests
  - Forks ?`;

/* ---------- storage ---------- */
function saveLocal(){ls('waypoint-maps',JSON.stringify({maps:S.maps,done:S.done}))}
function startLocal(){
  S.mode='local';let d=null;try{d=JSON.parse(ls('waypoint-maps')||'null')}catch(e){}
  if(!d||!Array.isArray(d.maps)){const m=parseOutline(SAMPLE);d={maps:[{id:'mexample',createdAt:Date.now(),...m}],done:{}}}
  S.maps=d.maps;S.done=d.done||{};S.ready=true;pickCurrent();render();
}
function onWriteErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){S.canWrite=false;S.editing=false;render();toast('You can view this roadmap but not change it.')}
  else if(c==='quota_exceeded')toast('Storage is full. Delete a roadmap, then try again.');
  else if(c==='resource_exhausted')toast('Too many changes at once. Wait a moment and try again.');
  else toast('That change did not save. Check your connection and try again.');
}
async function saveMap(m){
  m.updatedAt=Date.now();
  const i=S.maps.findIndex(x=>x.id===m.id);if(i<0)S.maps.push(m);else S.maps[i]=m;
  if(S.mode==='db'){render();const{id,...body}=m;try{await S.db.collection('maps').doc(id).set(JSON.parse(JSON.stringify(body)))}catch(e){onWriteErr(e)}}
  else{saveLocal();render()}
}
async function deleteMap(id){
  S.maps=S.maps.filter(x=>x.id!==id);
  if(S.mode==='db'){try{await S.db.collection('maps').doc(id).delete()}catch(e){onWriteErr(e)}}else saveLocal();
  S.current=null;pickCurrent();render();
}
function doneSet(mapId){return new Set(S.done[mapId]||[])}
async function toggleDone(kidId){
  const m=cur();if(!m)return;const set=doneSet(m.id);set.has(kidId)?set.delete(kidId):set.add(kidId);
  S.done[m.id]=[...set];render();
  if(S.mode==='db'){
    if(!S.uid){toast('Sign in to save your progress.');return}
    try{await S.db.collection('data/users/'+S.uid).doc('progress').set({done:S.done})}catch(e){toast('Your progress did not save. Try again.')}
  }else saveLocal();
}

async function boot(){
  render();
  const c=window.claude;
  const db=c&&c.use?await c.use('db').catch(()=>null):null;
  if(!db){startLocal();return}
  S.mode='db';S.db=db;
  const user=await c.use('user').catch(()=>null);
  if(user){try{S.uid=await user.id()}catch(e){}try{if(await user.can('data.write')===false)S.canWrite=false}catch(e){}}
  c.use('downloads').then(d=>{S.downloads=d}).catch(()=>{});
  db.collection('maps').onSnapshot(s=>{S.maps=s.docs.map(d=>({id:d.id,...d.data()}));S.ready=true;pickCurrent();render()},
    e=>{S.ready=true;if(e&&(e.code==='revoked'||e.code==='not_granted'))S.canWrite=false;render()});
  if(S.uid)db.doc('data/users/'+S.uid+'/progress').get().then(snap=>{if(snap.exists){S.done=(snap.data().done)||{};render()}}).catch(()=>{});
}

/* ---------- selection ---------- */
const sortedMaps=()=>S.maps.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const cur=()=>S.maps.find(m=>m.id===S.current);
function pickCurrent(){
  const h=(location.hash||'').slice(1);
  if(h&&S.maps.some(m=>m.id===h)){if(S.current!==h){S.current=h;S.cam=null}return}
  if(S.current&&S.maps.some(m=>m.id===S.current))return;
  const saved=ls('waypoint-current');
  S.current=(saved&&S.maps.some(m=>m.id===saved))?saved:(sortedMaps()[0]||{}).id||null;S.cam=null;
}
function setCurrent(id){S.current=id;S.cam=null;ls('waypoint-current',id);try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}render()}
window.addEventListener('hashchange',()=>{pickCurrent();render()});

/* ---------- layout ---------- */
const G={secW:230,kidW:210,row:58,gap:84,secGap:56,top:130};
function layout(m){
  const X0=G.secW/2+G.gap+G.kidW/2;const W=2*(X0+G.kidW/2)+80;const cx=W/2;
  const nodes=[],wires=[];let y=G.top;
  nodes.push({type:'title',x:cx,y:50,w:Math.min(W-40,520),label:m.name});
  let prevY=50;
  m.sections.forEach((s,si)=>{
    const kids=s.children.slice();if(S.editing)kids.push({add:true,id:'add-'+s.id});
    const R=kids.filter((_,i)=>i%2===0),L=kids.filter((_,i)=>i%2===1);
    const n=Math.max(1,R.length,L.length);const h=n*G.row;const sy=y+h/2;
    wires.push({spine:true,d:`M${cx} ${prevY} L${cx} ${sy}`});prevY=sy;
    nodes.push({type:'sec',x:cx,y:sy,w:G.secW,s,si});
    [[R,1],[L,-1]].forEach(([arr,dir])=>arr.forEach((k,j)=>{
      const ky=sy-(arr.length*G.row)/2+j*G.row+G.row/2;const kx=cx+dir*X0;
      const x1=cx+dir*G.secW/2,x2=kx-dir*G.kidW/2,mx=(x1+x2)/2;
      wires.push({d:`M${x1} ${sy} C${mx} ${sy} ${mx} ${ky} ${x2} ${ky}`,kid:k.id});
      nodes.push({type:k.add?'add':'kid',x:kx,y:ky,w:G.kidW,k,s});
    }));
    y+=h+G.secGap;
  });
  if(S.editing){const ay=y+10;wires.push({spine:true,d:`M${cx} ${prevY} L${cx} ${ay}`});nodes.push({type:'addsec',x:cx,y:ay,w:G.secW});y=ay+40}
  return{nodes,wires,W,H:y+60};
}

/* ---------- render ---------- */
function render(){
  $('#v-map').setAttribute('aria-pressed',S.view==='map');
  $('#v-list').setAttribute('aria-pressed',S.view==='list');
  const eb=$('#editBtn');eb.hidden=!(S.canWrite&&cur());eb.setAttribute('aria-pressed',S.editing);eb.textContent=S.editing?'Done editing':'Edit';

  const ms=sortedMaps();
  $('#pick').innerHTML=ms.length?`<select id="rm" aria-label="Roadmap">${ms.map(m=>`<option value="${esc(m.id)}" ${m.id===S.current?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
    ${S.canWrite?`<button class="btn ghost" data-act="new-map">+ New</button>`:''}`:'';

  const notes=[];
  if(S.mode==='local')notes.push('<b>Saved in this browser only.</b> Open this page on claude.ai while signed in to share roadmaps.');
  if(S.mode==='db'&&!S.canWrite)notes.push('<b>View only.</b> You can tick off topics to track your own progress. Ask the owner for Contributor access to edit.');
  $('#notice').innerHTML=notes.map(n=>`<div class="note">${n}</div>`).join('');

  const main=$('#main');const m=cur();
  if(!S.ready){$('#subhead').innerHTML='';main.innerHTML=`<div class="empty"><div><h1>Opening your roadmaps…</h1></div></div>`;return}
  if(!m){
    $('#subhead').innerHTML='';
    main.innerHTML=`<div class="empty"><div><h1>Map out what to learn, step by step.</h1>
      <p>Build a visual roadmap of topics and subtopics, mark what matters most, attach resources, and share it. Everyone who opens it can tick off their own progress.</p>
      ${S.canWrite?`<div class="row"><button class="btn primary" data-act="new-map">Create a roadmap</button><button class="btn" data-act="import">Paste an outline</button></div>`:'<p>No roadmaps have been shared here yet.</p>'}</div></div>`;
    return;
  }
  const d=doneSet(m.id);const total=m.sections.reduce((a,s)=>a+s.children.length,0);
  const got=m.sections.reduce((a,s)=>a+s.children.filter(k=>d.has(k.id)).length,0);const pct=total?Math.round(got/total*100):0;
  $('#subhead').innerHTML=`<div class="sub"><div class="grow"><h1>${esc(m.name)}</h1>${m.summary?`<div class="desc">${esc(m.summary)}</div>`:''}</div>
    <div class="prog" title="Your progress"><div class="track"><i style="width:${pct}%"></i></div>${got}/${total} done · ${pct}%</div>
    <div class="legend"><span><i class="sw core"></i>Must know</span><span><i class="sw good"></i>Good to know</span><span><i class="sw optional"></i>Optional</span><span><i class="sw done"></i>Done</span></div>
    ${S.editing?`<button class="btn" data-act="edit-map">Rename or delete</button>`:''}</div>`;

  if(S.view==='list'){
    main.innerHTML=`<div class="list"><div class="inner">${m.sections.map((s,i)=>`<section class="lsec" style="--c:var(--${s.color||'c1'})">
      <h2>${i+1}. ${esc(s.title)} <small>${s.children.filter(k=>d.has(k.id)).length}/${s.children.length}</small></h2>
      <ul>${s.children.map(k=>`<li class="lrow ${d.has(k.id)?'done':''}"><input type="checkbox" id="ck-${esc(k.id)}" data-done="${esc(k.id)}" ${d.has(k.id)?'checked':''} aria-label="Done: ${esc(k.title)}">
        <span class="tt" data-open="${esc(k.id)}">${esc(k.title)}</span>${k.level!=='good'?`<span class="tag ${k.level}">${LEVELS[k.level]}</span>`:''}${(k.links||[]).length?`<span class="tag">${k.links.length} link${k.links.length>1?'s':''}</span>`:''}</li>`).join('')||'<li class="lrow"><span class="tt" style="color:var(--muted)">No subtopics yet</span></li>'}</ul></section>`).join('')}</div></div>`;
    renderModal();return;
  }

  const L=layout(m);
  main.innerHTML=`<div class="viewport" id="vp"><div class="stage" id="stage" style="width:${L.W}px;height:${L.H}px">
    <svg width="${L.W}" height="${L.H}" aria-hidden="true">${L.wires.map(w=>`<path class="wire ${w.spine?'spine':''} ${w.kid&&d.has(w.kid)?'done':''}" d="${w.d}"/>`).join('')}</svg>
    ${L.nodes.map(n=>nodeHTML(n,d)).join('')}</div>
    <div class="zoom"><button data-act="zin" aria-label="Zoom in">+</button><button data-act="zout" aria-label="Zoom out">−</button><button data-act="fit" aria-label="Fit to screen">⤢</button></div>
    <div class="hint">Drag to move · Ctrl + scroll to zoom · Click a topic for details</div></div>`;
  S.layout=L;applyCam();renderModal();
}
function nodeHTML(n,d){
  const st=`left:${n.x}px;top:${n.y}px;width:${n.w}px`;
  if(n.type==='title')return `<div class="node title-node" style="left:${n.x}px;top:${n.y}px;max-width:${n.w}px"><span class="t">${esc(n.label)}</span></div>`;
  if(n.type==='sec')return `<div class="node sec" role="button" tabindex="0" data-sec="${esc(n.s.id)}" style="${st};--c:var(--${n.s.color||'c1'})"><span class="t">${esc(n.s.title)}</span><span class="n">${n.s.children.filter(k=>d.has(k.id)).length}/${n.s.children.length}</span></div>`;
  if(n.type==='add')return `<button class="node addnode" data-act="new-kid" data-s="${esc(n.s.id)}" style="${st}">+ Add subtopic</button>`;
  if(n.type==='addsec')return `<button class="node addnode" data-act="new-sec" style="${st}">+ Add topic</button>`;
  const k=n.k,dn=d.has(k.id);
  return `<div class="node kid ${k.level||'good'} ${dn?'done':''}" role="button" tabindex="0" data-open="${esc(k.id)}" style="${st}" title="${esc(k.title)}"><span class="ck">${dn?'✓':''}</span><span class="t">${esc(k.title)}</span>${(k.links||[]).length?`<span class="lk">↗${k.links.length}</span>`:''}</div>`;
}

/* ---------- pan & zoom ---------- */
function fitCam(){const vp=$('#vp');if(!vp||!S.layout)return;const vw=vp.clientWidth;const k=Math.min(1,Math.max(.3,(vw-24)/S.layout.W));S.cam={k,x:(vw-S.layout.W*k)/2,y:12}}
function applyCam(){const st=$('#stage');if(!st)return;if(!S.cam)fitCam();st.style.transform=`translate(${S.cam.x}px,${S.cam.y}px) scale(${S.cam.k})`}
function zoomAt(f,px,py){const c=S.cam;const k=Math.min(2,Math.max(.25,c.k*f));c.x=px-(px-c.x)*(k/c.k);c.y=py-(py-c.y)*(k/c.k);c.k=k;applyCam()}
let pan=null;
document.addEventListener('pointerdown',e=>{const vp=e.target.closest&&e.target.closest('#vp');if(!vp||e.target.closest('.node,.zoom'))return;
  pan={x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y,id:e.pointerId};vp.classList.add('panning');try{vp.setPointerCapture(e.pointerId)}catch(err){}});
document.addEventListener('pointermove',e=>{if(!pan||e.pointerId!==pan.id)return;S.cam.x=pan.cx+e.clientX-pan.x;S.cam.y=pan.cy+e.clientY-pan.y;applyCam()});
document.addEventListener('pointerup',e=>{if(!pan)return;pan=null;const vp=$('#vp');if(vp)vp.classList.remove('panning')});
document.addEventListener('wheel',e=>{const vp=e.target.closest&&e.target.closest('#vp');if(!vp||!S.cam)return;e.preventDefault();
  const r=vp.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top);
  else{S.cam.x-=e.deltaX;S.cam.y-=e.deltaY;applyCam()}},{passive:false});
window.addEventListener('resize',()=>{if(S.view==='map'){S.cam=null;applyCam()}});

/* ---------- dialogs ---------- */
function openModal(m){S.modal=m;m.key=m.key||Math.random().toString(36);renderModal(true);setTimeout(()=>{const f=$('#overlay [autofocus]');if(f)f.focus()},0)}
function closeModal(){S.modal=null;renderModal(true)}
function findKid(m,id){for(const s of m.sections){const k=s.children.find(x=>x.id===id);if(k)return{s,k}}return null}

        <div class="actions"><button class="btn ${dn?'':'primary'}" data-act="toggle" data-id="${esc(k.id)}">${dn?'Mark as not done':'Mark as done'}</button><span class="sp"></span><button class="btn" data-act="close">Close</button></div></div>`;
    }else{
      const linkTxt=(k.links||[]).map(l=>(l.label?l.label+' | ':'')+l.url).join('\n');

        <div class="field"><label for="k-note">Notes</label><textarea id="k-note" name="note" maxlength="2000" placeholder="What to learn here, tips, what to skip">${esc(k.note)}</textarea></div>

        ${del('this subtopic','del-kid-yes')}
        <div class="actions">${md.isNew?'':`<button type="button" class="btn ghost" data-act="del-ask" style="color:var(--danger)">Delete</button>`}<span class="sp"></span>
          <button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">${md.isNew?'Add':'Save'}</button></div></form>`;
    }
  }else if(md.type==='sec'){
    const s=md.s;const idx=m.sections.findIndex(x=>x.id===s.id);
    if(!S.editing){
      const d=doneSet(m.id);
      h=`<div class="panel"><h2>${esc(s.title)}</h2><p class="lead">${s.children.filter(k=>d.has(k.id)).length} of ${s.children.length} subtopics done.</p>

    }else{
      h=`<form class="panel" id="secForm"><h2>${md.isNew?'New topic':'Edit topic'}</h2>
        <div class="field"><label for="s-title">Title</label><input id="s-title" name="title" required maxlength="80" value="${esc(s.title)}" autofocus></div>

        ${!md.isNew?`<div class="field"><span class="lbl">Position</span><div style="display:flex;gap:8px"><button type="button" class="btn" data-act="sec-move" data-dir="-1" ${idx<=0?'disabled':''}>Move up</button><button type="button" class="btn" data-act="sec-move" data-dir="1" ${idx>=m.sections.length-1?'disabled':''}>Move down</button></div></div>`:''}

      <textarea id="imp" name="text" class="mono" style="min-height:260px" autofocus>${esc(md.text||'')}</textarea>
      <div class="actions"><span class="sp"></span><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Create roadmap</button></div></form>`;
  }else if(md.type==='share'){
    h=`<div class="panel"><h2>Share this roadmap</h2>
      ${S.mode==='db'?`<div class="share-step"><h3>1. Invite people</h3><p>Use the <b>Share</b> menu at the top of this page. Viewers can follow the roadmap and tick off their own progress. Give Contributor access to people who should edit it.</p></div>`:`<p class="lead">This copy saves to your browser only. Open the published page on claude.ai while signed in to share a live roadmap.</p>`}
      <div class="share-step"><h3>${S.mode==='db'?'2. ':''}Link straight to this roadmap</h3><p>Add this to the end of the page link.</p>

let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const clone=m=>JSON.parse(JSON.stringify(m));
function formVals(id){const f=document.getElementById(id);const o={};if(f)for(const[k,v]of new FormData(f).entries())o[k]=v;return o}

/* ---------- actions ---------- */
function openNode(el){
  const m=cur();if(!m)return;
  if(el.dataset.open){const r=findKid(m,el.dataset.open);if(r)openModal({type:'kid',k:clone(r.k),s:r.s,isNew:false})}
  else if(el.dataset.sec){const s=m.sections.find(x=>x.id===el.dataset.sec);if(s)openModal({type:'sec',s:clone(s),isNew:false})}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.node[role="button"]')){e.preventDefault();openNode(e.target)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='rm')setCurrent(e.target.value);
  if(e.target.dataset&&e.target.dataset.done)toggleDone(e.target.dataset.done);
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el){const n=e.target.closest('[data-open],[data-sec]');if(n&&!n.matches('input'))openNode(n);return}
  const a=el.dataset.act;const m=cur();
  if(a==='backdrop'){if(e.target===el)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='view'){S.view=el.dataset.v;ls('waypoint-view',S.view);S.cam=null;render();return}
  if(a==='edit'){S.editing=!S.editing;render();return}
  if(a==='zin'||a==='zout'){const vp=$('#vp');zoomAt(a==='zin'?1.2:1/1.2,vp.clientWidth/2,vp.clientHeight/2);return}
  if(a==='fit'){S.cam=null;applyCam();return}
  if(a==='share'){if(m)openModal({type:'share'});else toast('Create a roadmap first.');return}
  if(a==='new-map'){openModal({type:'map',map:{name:'',summary:''},isNew:true});return}
  if(a==='edit-map'){openModal({type:'map',map:clone(m),isNew:false});return}
  if(a==='import'){openModal({type:'import',text:SAMPLE.replace('# Example: Learn Git','# My roadmap').replace(/^> .*\n/m,'')});return}
  if(a==='new-sec'){openModal({type:'sec',s:{id:newId('s'),title:'',color:COLORS[m.sections.length%COLORS.length],children:[]},isNew:true});return}
  if(a==='new-kid'){const s=m.sections.find(x=>x.id===el.dataset.s);openModal({type:'kid',s,k:{id:newId('k'),title:'',level:'good',note:'',links:[]},isNew:true});return}
  if(a==='toggle'){await toggleDone(el.dataset.id);closeModal();return}
  if(a==='sec-all'){const s=m.sections.find(x=>x.id===el.dataset.id);const d=doneSet(m.id);s.children.forEach(k=>d.add(k.id));S.done[m.id]=[...d];closeModal();
    if(S.mode==='db'){if(S.uid)try{await S.db.collection('data/users/'+S.uid).doc('progress').set({done:S.done})}catch(err){toast('Your progress did not save. Try again.')}}else saveLocal();render();return}
  if(a==='del-ask'||a==='del-no'){keepForm();S.modal.confirm=a==='del-ask';renderModal(true);return}
  if(a==='del-kid-yes'){const mm=clone(m);mm.sections.forEach(s=>s.children=s.children.filter(k=>k.id!==S.modal.k.id));closeModal();await saveMap(mm);toast('Subtopic deleted');return}
  if(a==='del-sec-yes'){const mm=clone(m);mm.sections=mm.sections.filter(s=>s.id!==S.modal.s.id);closeModal();await saveMap(mm);toast('Topic deleted');return}
  if(a==='del-map-yes'){const id=S.modal.map.id;closeModal();await deleteMap(id);toast('Roadmap deleted');return}
  if(a==='sec-move'){const mm=clone(m);const i=mm.sections.findIndex(s=>s.id===S.modal.s.id);const j=i+(+el.dataset.dir);if(j<0||j>=mm.sections.length)return;
    [mm.sections[i],mm.sections[j]]=[mm.sections[j],mm.sections[i]];keepForm();await saveMap(mm);renderModal(true);return}
  if(a==='copy'||a==='copy-outline'){
    let src=a==='copy'?document.getElementById(el.dataset.src):null;const text=src?src.value:toOutline(m);
    try{await navigator.clipboard.writeText(text);toast('Copied')}catch(err){if(src){src.focus();src.select();toast('Press Ctrl+C or ⌘C to copy the selected text')}else{const t=$('#mdOut');t.value=text;t.focus();t.select();toast('Outline selected. Press Ctrl+C or ⌘C to copy.')}}
    return}
  if(a==='download'){
    try{await S.downloads.save({filename:(m.name||'roadmap').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'.md',data:toMarkdown(m)})}catch(err){if(err&&err.code==='unavailable'){S.downloads=null;renderModal(true)}}
    return}
});
function keepForm(){ // carry typed values across a dialog re-render
  const md=S.modal;if(!md)return;
  if(md.type==='kid'&&$('#kidForm')){const v=formVals('kidForm');Object.assign(md.k,{title:v.title,level:v.level,note:v.note,links:parseLinks(v.links)})}
  if(md.type==='sec'&&$('#secForm')){const v=formVals('secForm');md.s.title=v.title;md.s.color=v.color||md.s.color}
  if(md.type==='map'&&$('#mapForm')){const v=formVals('mapForm');md.map.name=v.name;md.map.summary=v.summary}
}
function parseLinks(t){return(t||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf('|');const url=safeUrl(i>=0?l.slice(i+1):l);return url?{label:i>=0?l.slice(0,i).trim():'',url}:null}).filter(Boolean).slice(0,10)}

document.addEventListener('submit',async e=>{
  e.preventDefault();const md=S.modal;if(!md)return;keepForm();const m=cur();
  if(md.type==='kid'){
    const k=md.k;k.title=(k.title||'').trim();if(!k.title){toast('Give the subtopic a title.');return}
    const mm=clone(m);const s=mm.sections.find(x=>x.id===md.s.id);if(!s)return;
    const i=s.children.findIndex(x=>x.id===k.id);if(i<0)s.children.push(k);else s.children[i]=k;
    closeModal();await saveMap(mm);
  }else if(md.type==='sec'){
    const s=md.s;s.title=(s.title||'').trim();if(!s.title){toast('Give the topic a title.');return}
    const mm=clone(m);const i=mm.sections.findIndex(x=>x.id===s.id);
    if(i<0)mm.sections.push(s);else mm.sections[i]={...mm.sections[i],title:s.title,color:s.color};
    closeModal();await saveMap(mm);
  }else if(md.type==='map'){
    const r=md.map;r.name=(r.name||'').trim();if(!r.name){toast('Give the roadmap a name.');return}
    if(md.isNew){const nm={id:newId('m'),createdAt:Date.now(),name:r.name,summary:(r.summary||'').trim(),sections:[]};closeModal();S.editing=true;await saveMap(nm);setCurrent(nm.id);toast('Roadmap created. Add your first topic.')}
    else{const mm=clone(m);mm.name=r.name;mm.summary=(r.summary||'').trim();closeModal();await saveMap(mm)}
  }else if(md.type==='import'){
    const v=formVals('impForm');const p=parseOutline(v.text||'');if(!p.sections.length){toast('Add at least one topic line.');return}
    const nm={id:newId('m'),createdAt:Date.now(),...p};closeModal();await saveMap(nm);setCurrent(nm.id);toast('Roadmap created');
  }
});

S.view=ls('waypoint-view')==='list'?'list':'map';
boot();
</script>
